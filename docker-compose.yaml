version: '3'

services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    restart: always
    ports:
      - "8267:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - etc_influxdb_data:/etc/influxdb2
    environment:
      - TZ=Europe/Moscow
    networks:
      - practic4_docker-main_monitoring_system_p1
      
  
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: always
    networks:
      - practic4_docker-main_monitoring_system_p1
    depends_on:
      - influxdb
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/rootfs/sys:ro
      - /proc:/rootfs/proc:ro
      - /etc:/rootfs/etc:ro
    environment:
      - TZ=Europe/Moscow
      - HOST_PROC=/rootfs/proc
      - HOST_SYS=/rootfs/sys
      - HOST_ETC=/rootfs/etc
    privileged: true

volumes:
  influxdb_data:
  etc_influxdb_data:

networks:
  practic4_docker-main_monitoring_system_p1:
    external: true